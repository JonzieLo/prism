[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prism"
version = "0.1.1"
dependencies = [
    "numpy",
    "scipy",
    "pytest",
    "pytest-asyncio",
    "websockets",
    "python-dotenv",
    "matplotlib",
    "httpx"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that call external Deribit services",
    "forwards: put-call parity, implied forwards, basis, chain forensics",
    "pricing: all pricing models - Black-Scholes, Black-76, Binomial, Bachelier, Inverse"
]