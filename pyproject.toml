[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prism"
version = "0.1.0"
dependencies = [
    "scipy",
    "pytest",
    "pytest-asyncio",
    "websockets",
    "python-dotenv"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]